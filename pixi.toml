[workspace]
authors = ["Michael Booth <michael@databooth.com.au>"]
channels = ["conda-forge", "https://conda.modular.com/max"]
name = "mojo-data-star"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

description = "Interactive Mandelbrot explorer with Mojo, FastHTML, Datastar, and pixi-managed environments."

[activation]
# Ensure src/ is on the Python path inside the pixi environment
env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/src" }

[tasks]
# Build the Mojo extension module as a shared library for Python
build = "mojo build mandelbrot.mojo --emit shared-lib -o mandelbrot.so"

# Run Mojo TestSuite tests (add project root to import path for mandelbrot.mojo)
test-mojo = "mojo -I . tests/test_mandelbrot.mojo"

# Run Python tests
test-py = "pytest"

# Run all tests
test = "pytest && mojo run -I . tests/test_mandelbrot.mojo"

# Serve the FastHTML app (FastHTML wraps Starlette/uvicorn under the hood)
serve = "uvicorn mojo_data_star.app:app --reload --port 8000"

[dependencies]
# Mojo 1.0 beta line (MAX 26.x)
max = ">=26.1.0,<27"
python = "3.12.*"
uv = "*"
pytest = "*"
uvicorn = "*"
httpx = "*"
pillow = "*"
"python-fasthtml" = "*"      # FastHTML framework
"datastar-py" = "*"          # Datastar Python helpers (import name datastar_py)
